<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quiz 4 - Professor Moreira</title><style>
:root{--azul:#0b5ed7;--azul2:#eaf4ff;--verde:#198754;--vermelho:#dc3545;--cinza:#f5f7fa;--texto:#172033}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#dff1ff,#f8fbff);color:var(--texto)}
.app{max-width:760px;margin:auto;min-height:100vh;padding:12px 12px 92px}
.brand{background:#083b7a;color:white;border-radius:18px;padding:14px 16px;text-align:center;box-shadow:0 5px 18px #0002;margin-bottom:12px}
.brand h1{font-size:21px;margin:0 0 5px}.brand .sub{font-size:15px;font-weight:700;color:#ffe66d}
.card{background:white;border-radius:20px;padding:18px;box-shadow:0 5px 20px #0002;min-height:68vh}
.meta{font-weight:800;color:var(--azul);font-size:15px;margin-bottom:10px}.title{font-size:22px;font-weight:900;margin-bottom:14px}
.question{font-size:19px;line-height:1.45;font-weight:650;white-space:normal}
.options{display:grid;gap:10px;margin-top:16px}
.option{border:2px solid #cbd7e6;background:#fff;border-radius:14px;padding:13px;font-size:18px;line-height:1.35;text-align:left;cursor:pointer}
.option.selected{border-color:var(--azul);background:var(--azul2)}
.confirm{width:100%;margin-top:16px;border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:900;background:var(--azul);color:white}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:12px;font-size:17px;font-weight:800}
.feedback.ok{display:block;background:#d9f6e5;color:#075b2c}.feedback.bad{display:block;background:#ffe0e3;color:#8a1420}
.resolution{font-size:19px;line-height:1.55}.resolution b{color:#073b78}
.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(8px);border-top:1px solid #d7e1ec;padding:10px;display:flex;gap:8px;justify-content:center}
.nav button{border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:900;background:#0b5ed7;color:white;min-width:78px}.nav .restart{background:#5b6470}
.counter{text-align:center;font-weight:800;margin:10px;color:#456}
.note{background:#fff3cd;border:1px solid #ffe69c;padding:10px;border-radius:10px;margin-top:12px;font-size:15px}
@media(max-width:520px){.app{padding:8px 8px 88px}.card{padding:15px;min-height:72vh}.question,.resolution{font-size:17px}.option{font-size:16.5px;padding:12px}.brand h1{font-size:19px}.title{font-size:20px}}
</style></head>
<body><div class="app"><div class="brand"><h1>CURSO DE CONTABILIDADE PROFESSOR MOREIRA</h1><div class="sub">FGV • EXAME DE SUFICIÊNCIA DO CFC</div></div><div id="counter" class="counter"></div><main id="card" class="card"></main></div>
<div class="nav"><button id="prev" onclick="prev()">← Voltar</button><button class="restart" onclick="restart()">↻ Reiniciar</button><button id="next" onclick="next()">Avançar →</button></div>
<script>const DATA=[{"n": 57, "q": "Um curso de idiomas oferecia aulas de inglês, espanhol e japonês. Em 2024, a gerência do curso resolveu extinguir a oferta de aulas de japonês e espanhol, passando a oferecer apenas aulas de inglês. A reorganização dos cursos teve efeito material na natureza e no foco das operações do curso, de modo que foi constituída uma provisão para reestruturação. Assinale a opção que indica gastos que podem ser incluídos no valor da provisão.", "opts": ["(A) Novo treinamento da equipe permanente", "(B) Investimento em novos sistemas e redes de distribuição.", "(C) Gastos incrementais de marketing relacionado ao curso de inglês.", "(D) Indenização aos proprietários das salas onde eram ofertados os cursos e que deixaram de ser utilizadas."], "ans": 3, "res": "<b>Gabarito: D.</b><br><br>A provisão para reestruturação inclui somente desembolsos <b>diretamente decorrentes da reestruturação</b> e que não estejam associados às atividades continuadas da entidade.<br><br>A indenização relativa às salas que deixaram de ser utilizadas decorre diretamente da reestruturação. Treinamento, novos sistemas e marketing relacionam-se às operações futuras."}, {"n": 58, "q": "Em 01/01/2020, uma sociedade empresária adquiriu uma van para transportar os seus empregados por R$ 300.000. A vida útil foi estimada em 15 anos e não foi considerado valor residual. Em 2023, essa van apresentou diversos problemas que ocasionaram gastos de R$ 24.000 com reparos. Por conta dos problemas, a sociedade empresária decidiu comprar uma nova van e, em 31/12/2023, vendeu a antiga por R$ 250.000. O lucro obtido com a venda da van, considerando que a sociedade empresária utiliza o método da linha reta para depreciar os seus ativos imobilizados, foi de", "opts": ["(A) R$ 6.000.", "(B) R$ 10.000.", "(C) R$ 28.000.", "(D) R$ 30.000."], "ans": 3, "res": "<b>Gabarito: D.</b><br><br>Depreciação anual = R$ 300.000 ÷ 15 = <b>R$ 20.000</b>.<br>De 2020 a 2023: 4 anos × R$ 20.000 = <b>R$ 80.000</b>.<br>Valor contábil em 31/12/2023 = 300.000 − 80.000 = <b>R$ 220.000</b>.<br>Venda = R$ 250.000.<br><br><b>Lucro = 250.000 − 220.000 = R$ 30.000.</b><br><br>Os R$ 24.000 de reparos são despesa e não entram no cálculo do ganho na baixa."}, {"n": 59, "q": "Uma sociedade empresária elaborou a seguinte Demonstração do Resultado do Exercício:<br><br><b>[O quadro da DRE mencionado no enunciado não aparece visível no PDF fornecido.]</b><br><br>De acordo com a NBC TG 26 (R5) – APRESENTAÇÃO DAS DEMONSTRAÇÕES CONTÁBEIS, a demonstração é elaborada de acordo com o método da", "opts": ["(A) função da despesa e não é necessária divulgação adicional.", "(B) natureza da despesa e não é necessária divulgação adicional.", "(C) função da despesa e a sociedade empresária deve divulgar informação adicional sobre a natureza das despesas.", "(D) natureza da despesa e a sociedade empresária deve divulgar informação adicional sobre a função das despesas."], "ans": null, "res": "<b>Atenção à fonte:</b> no PDF fornecido, o enunciado diz “a seguinte Demonstração do Resultado do Exercício”, mas o quadro da DRE não está visível. Sem esse quadro, não é possível identificar com segurança se a apresentação é por <b>função</b> ou por <b>natureza</b> da despesa.<br><br><b>Regra importante:</b> quando a entidade classifica as despesas por <b>função</b>, deve divulgar informação adicional sobre a <b>natureza</b> das despesas.<br><br>Por fidelidade ao PDF, esta questão foi mantida sem marcar gabarito automaticamente."}, {"n": 60, "q": "Em 31/12/2023, uma loja de cosméticos apresentava os seguintes saldos em seu Balanço Patrimonial:<br><br>Disponibilidades: R$ 55.000;<br>Estoques: R$ 30.000;<br>Clientes: R$ 20.000;<br>Equipamentos de Informática: R$ 45.000;<br>Salários a pagar: R$ 15.000;<br>Empréstimos: R$ 35.000;<br>Capital Social: R$ 120.000;<br>Prejuízos Acumulados: R$ 20.000.<br><br>No primeiro trimestre de 2024, aconteceram os seguintes fatos:<br>• Venda, à vista, de todo o estoque por R$ 80.000;<br>• Recebimento do saldo dos clientes;<br>• Venda, à vista, dos equipamentos de informática por R$ 60.000;<br>• Pagamento dos salários do ano anterior;<br>• Pagamento do empréstimo bancário contraído;<br>• Reconhecimento e pagamento de despesas gerais por R$ 100.000.<br><br>Em relação ao primeiro trimestre de 2024, é correto afirmar que a atividade operacional", "opts": ["(A) gerou fluxo líquido de caixa no montante de R$ 10.000.", "(B) gerou fluxo líquido de caixa no montante de R$ 45.000.", "(C) consumiu fluxo líquido de caixa no montante de R$ 15.000.", "(D) consumiu fluxo líquido de caixa no montante de R$ 35.000."], "ans": 2, "res": "<b>Gabarito: C.</b><br><br>Considere apenas os fluxos <b>operacionais</b>:<br>+ Venda de estoque: R$ 80.000<br>+ Recebimento de clientes: R$ 20.000<br>− Pagamento de salários: R$ 15.000<br>− Despesas gerais: R$ 100.000<br><br><b>Fluxo operacional = 80.000 + 20.000 − 15.000 − 100.000 = − R$ 15.000.</b><br><br>Logo, a atividade operacional <b>consumiu R$ 15.000</b>. Venda de equipamentos é investimento; pagamento do empréstimo é financiamento."}];
let screen=0, selected={};
const total=DATA.length*2;
function render(){
 const qi=Math.floor(screen/2), isRes=screen%2===1, d=DATA[qi];
 document.getElementById('counter').textContent=`Tela ${screen+1}/${total} • Questão ${d.n}`;
 let c=document.getElementById('card');
 if(!isRes){
   let opts=d.opts.map((o,i)=>`<button class="option ${selected[qi]===i?'selected':''}" onclick="choose(${qi},${i})">${o}</button>`).join('');
   c.innerHTML=`<div class="meta">FGV • Exame de Suficiência do CFC</div><div class="title">Questão ${d.n}</div><div class="question">${d.q}</div><div class="options">${opts}</div><button class="confirm" onclick="confirmAnswer(${qi})">Confirmar Resposta</button><div id="fb" class="feedback"></div>`;
 }else{
   c.innerHTML=`<div class="meta">FGV • Exame de Suficiência do CFC</div><div class="title">Resolução • Questão ${d.n}</div><div class="resolution">${d.res}</div>`;
 }
 document.getElementById('prev').disabled=screen===0;
 document.getElementById('next').disabled=screen===total-1;
 window.scrollTo({top:0,behavior:'smooth'});
}
function choose(qi,i){selected[qi]=i;render()}
function confirmAnswer(qi){
 const d=DATA[qi], fb=document.getElementById('fb');
 if(selected[qi]===undefined){fb.className='feedback bad';fb.textContent='Selecione uma alternativa antes de confirmar.';return}
 if(d.ans===null){fb.className='feedback ok';fb.textContent='Questão com elemento visual ausente no PDF. Consulte a tela de resolução.';return}
 if(selected[qi]===d.ans){fb.className='feedback ok';fb.textContent='🟢 Resposta correta!'} else {fb.className='feedback bad';fb.textContent='🔴 Resposta incorreta. Veja a resolução na próxima tela.'}
}
function next(){if(screen<total-1){screen++;render()}}
function prev(){if(screen>0){screen--;render()}}
function restart(){screen=0;selected={};render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
let sx=0;document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(dx<-70)next();if(dx>70)prev()},{passive:true});
render();
</script></body></html>
