/* =========================================================
FUNCIONAMENTO DO QUIZ
========================================================= */

let screen=0;
let sel={};

const total=DATA.length*2;

function escnl(s){
    return s.replace(/\n/g,"<br>");
}

function render(){

    const qi=Math.floor(screen/2);
    const resolucao=screen%2===1;
    const d=DATA[qi];

    document.getElementById("count").textContent=
    `Tela ${screen+1} de ${total} • Questão ${d.n}`;

    const card=document.getElementById("card");

    if(!resolucao){

        let alternativas="";

        d.opts.forEach((o,i)=>{

            const classe=
            sel[qi]===i ? "opt sel" : "opt";

            alternativas+=`
            <button
            class="${classe}"
            onclick="choose(${qi},${i})">

            <strong>(${o[0]})</strong>
            ${escnl(o[1])}

            </button>
            `;
        });

        card.innerHTML=`

        <div class="meta">
        FGV • Exame de Suficiência do CFC
        </div>

        <div class="title">
        Questão ${d.n}
        </div>

        <div class="stem">
        ${escnl(d.stem)}
        </div>

        <div class="opts">
        ${alternativas}
        </div>

        <button
        class="confirm"
        onclick="check(${qi})">
        Confirmar Resposta
        </button>

        <div id="fb" class="fb"></div>
        `;

    }else{

        card.innerHTML=`

        <div class="meta">
        FGV • Exame de Suficiência do CFC
        </div>

        <div class="title">
        Resolução • Questão ${d.n}
        </div>

        <div class="res">
        <div class="box">
        ${d.res}
        </div>
        </div>
        `;
    }

    document.getElementById("prev").disabled=
    screen===0;

    document.getElementById("next").disabled=
    screen===total-1;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* SELECIONAR */

function choose(q,i){

    sel[q]=i;

    render();
}


/* CONFIRMAR */

function check(q){

    const d=DATA[q];

    const feedback=
    document.getElementById("fb");

    if(sel[q]===undefined){

        feedback.className="fb bad";

        feedback.innerHTML=
        "Selecione uma alternativa antes de confirmar.";

        return;
    }

    const letra=
    d.opts[sel[q]][0];

    if(letra===d.ans){

        feedback.className="fb ok";

        feedback.innerHTML=
        "🟢 RESPOSTA CORRETA!";

    }else{

        feedback.className="fb bad";

        feedback.innerHTML=
        "🔴 RESPOSTA INCORRETA.<br><br>Veja a resolução na próxima tela.";
    }
}


/* AVANÇAR */

function next(){

    if(screen<total-1){

        screen++;

        render();
    }
}


/* VOLTAR */

function prev(){

    if(screen>0){

        screen--;

        render();
    }
}


/* REINICIAR */

function resetQ(){

    screen=0;

    sel={};

    render();
}


/* SETAS DO TECLADO */

document.addEventListener(
"keydown",
function(evento){

    if(evento.key==="ArrowRight"){
        next();
    }

    if(evento.key==="ArrowLeft"){
        prev();
    }
});


/* SWIPE NO CELULAR */

let inicioToque=0;

document.addEventListener(
"touchstart",
function(evento){

    inicioToque=
    evento.touches[0].clientX;

},
{passive:true}
);

document.addEventListener(
"touchend",
function(evento){

    const fimToque=
    evento.changedTouches[0].clientX;

    const diferenca=
    fimToque-inicioToque;

    if(diferenca < -70){
        next();
    }

    if(diferenca > 70){
        prev();
    }

},
{passive:true}
);


/* INICIAR */

render();

</script>
